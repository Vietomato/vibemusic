<a routerLink="/app" class="flex px-6 py-0 mb-4 text-white">
  <ng-container [ngTemplateOutlet]="logoTmpl"></ng-container>
</a>

<ul class="m-0">
  @for (item of navItems$ | async; track item) {
    <li class="nav-link-container">
      <a 
        #link="routerLinkActive"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact! }"
        class="flex gap-4 items-center px-6 nav-link link-subtle transition-all"
        >
        <svg-icon
          class="transition-all"
          [size]="'lg'"
          [key]="$any(link.isActive && item.iconSelected ? item.iconSelected : item.icon)"
          title="duration"
        ></svg-icon>
        {{ item.label }}
      </a>
    </li>
  }

  <li class="nav-link-container mt-2">
      <a 
      routerLink="/app/vibe"
      routerLinkActive="active"
      class="flex gap-4 items-center px-6 nav-link link-subtle transition-all"
      >
      <span style="font-size: 20px; line-height: 1;">🎨</span>
      What's your vibe
    </a>
  </li>

  <li class="nav-link-container mt-2">
      <a 
      routerLink="/app/dashboard"
      routerLinkActive="active"
      class="flex gap-4 items-center px-6 nav-link link-subtle transition-all"
      >
      <span style="font-size: 20px; line-height: 1;">📊</span>
      Dashboard
    </a>
  </li>
</ul>

<as-nav-links />

<ng-template #logoTmpl>
  <img src="assets/VibeMusic.svg" alt="Vibe Music" style="height: 30px; width: auto;">
</ng-template>
