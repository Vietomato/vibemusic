@if (track) {
  <div class="cursor-pointer track-cover">
    <as-media-cover [imageUrl]="track.album.images[0]?.url">
    </as-media-cover>
  </div>

  <div class="flex flex-col">
    <div class="ellipsis-one-line">
      <span class="text-white font-bold">
        {{ track.name }}
      </span>
    </div>
    <div class="flex">
      @for (artist of track.artists | slice:0:2; track artist; let idx = $index) {
        @if (idx !== 0) {
          <span class="mr-1 text-description">,</span>
        }
        <span class="text-description ellipsis-one-line">
          {{ artist.name }}
        </span>
      }
    </div>
  </div>
}
